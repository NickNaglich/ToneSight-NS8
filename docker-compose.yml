services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: tonesight-api
    environment:
      - PYTHONUNBUFFERED=1
      - TONESIGHT_API_TOKEN=${TONESIGHT_API_TOKEN:?Set TONESIGHT_API_TOKEN in environment}
      - TONESIGHT_RATE_LIMIT_PER_MINUTE=${TONESIGHT_RATE_LIMIT_PER_MINUTE:-60}
      - TONESIGHT_ALLOWED_PATHS=${TONESIGHT_ALLOWED_PATHS:-/app}
    ports:
      - "8080:8080"
    command: uvicorn tonesight_ns8.observability_api:app --host 0.0.0.0 --port 8080

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: tonesight-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.2.0
    container_name: tonesight-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:?Set GF_SECURITY_ADMIN_USER in environment}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?Set GF_SECURITY_ADMIN_PASSWORD in environment}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
